version: 2
project_name: uca

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/uca
    binary: uca
    ldflags:
      - -s -w -X main.buildVersion={{ .Version }}
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

# Homebrew distribution is a cask (the formula-based `brews` section is
# deprecated since GoReleaser v2.10). The binaries are unsigned, so the
# post-install hook strips the Gatekeeper quarantine bit on macOS; without it
# the installed binary dies with "uca is damaged and cannot be opened".
homebrew_casks:
  - name: uca
    homepage: "https://github.com/chhoumann/uca"
    description: "Update multiple coding-agent CLIs with one command"
    repository:
      owner: chhoumann
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/uca"]
          end
